name: CI - Build, Test & Publish to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn clean verify

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push image (latest + commit SHA)
        run: |
          docker build -t mikeyapyc/taskflow:latest -t mikeyapyc/taskflow:${{ github.sha }} .
          docker push mikeyapyc/taskflow:latest
          docker push mikeyapyc/taskflow:${{ github.sha }}
